name: validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run package validate script
        run: bash scripts/validate.sh

      - name: Shellcheck pre-deploy gate (if available)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning extensions/pre-deploy-gate/scripts/pre-deploy-gate.sh
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            shellcheck -S warning extensions/pre-deploy-gate/scripts/pre-deploy-gate.sh
          fi
